name: Test

# main.py had never run: it referenced recipient_email where the variable was
# recipient_emails, so it raised NameError before sending anything. Nothing
# would have caught that — ruff's F821 does, in a second.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements-dev.txt

      - uses: astral-sh/ruff-action@v3.2.2
        with:
          version: "0.16.4"

      - name: Lint
        run: ruff check --no-fix

      - name: Format
        run: ruff format --check

      - name: Tests
        run: python -m pytest -q
